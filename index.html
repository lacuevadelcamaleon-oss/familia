<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador Familiar - Casa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- PANTALLA DE SELECCIÓN DE USUARIO -->
  <div id="pantalla-login" class="flex flex-col items-center justify-center min-h-screen p-4 bg-gradient-to-br from-indigo-600 to-purple-700">
    <div class="bg-white rounded-3xl shadow-2xl p-6 w-full max-w-md text-center">
      <div class="mb-6">
        <span class="text-5xl">🏡</span>
        <h1 class="text-2xl font-black text-slate-800 mt-2">Organizador de Casa</h1>
        <p class="text-xs text-slate-500 mt-1">Selecciona tu perfil para ingresar:</p>
      </div>
      
      <div class="grid grid-cols-2 gap-3" id="contenedor-usuarios">
        <!-- Perfiles -->
      </div>
    </div>
  </div>

  <!-- PANTALLA PRINCIPAL -->
  <div id="pantalla-app" class="hidden min-h-screen flex flex-col">
    <header class="bg-indigo-600 text-white p-4 shadow-lg flex justify-between items-center sticky top-0 z-50">
      <div class="flex items-center gap-3">
        <span id="user-avatar" class="text-3xl">👤</span>
        <div>
          <h2 id="user-nombre" class="font-bold text-base leading-tight">Usuario</h2>
          <p id="user-puntos" class="text-xs text-indigo-200 font-semibold">⭐ 0 Puntos</p>
        </div>
      </div>
      <button onclick="cerrarSesion()" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-xl transition font-medium">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> Cambiar
      </button>
    </header>

    <main class="flex-1 p-4 max-w-3xl mx-auto w-full mb-20">
      <section id="sec-tareas" class="space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-xl font-black text-slate-700">Mis Obligaciones</h3>
          <button onclick="abrirModalTarea()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-xl shadow transition">
            + Nueva Tarea
          </button>
        </div>
        <div id="lista-mis-tareas" class="space-y-3">
          <p class="text-xs text-slate-400 text-center py-6">Cargando tareas...</p>
        </div>
      </section>

      <section id="sec-general" class="hidden space-y-4">
        <h3 class="text-xl font-black text-slate-700">Pizarra Familiar</h3>
        <p class="text-xs text-slate-500">Resumen de avance de todos los integrantes:</p>
        <div id="tablon-familia" class="space-y-3">
          <p class="text-xs text-slate-400 text-center py-6">Cargando estado del hogar...</p>
        </div>
      </section>

      <section id="sec-notas" class="hidden space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-xl font-black text-slate-700">Notas y Pizarra</h3>
          <button onclick="abrirModalNota()" class="bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold px-3 py-2 rounded-xl shadow transition">
            + Agregar Nota
          </button>
        </div>
        <div id="contenedor-notas" class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <p class="text-xs text-slate-400 text-center col-span-2 py-6">Cargando notas...</p>
        </div>
      </section>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-3 text-center text-xs font-medium text-slate-500 z-50">
      <button onclick="cambiarSeccion('sec-tareas', this)" class="btn-nav flex flex-col items-center text-indigo-600">
        <i class="fa-solid fa-list-check text-xl mb-1"></i>
        <span>Mis Tareas</span>
      </button>
      <button onclick="cambiarSeccion('sec-general', this)" class="btn-nav flex flex-col items-center hover:text-indigo-600">
        <i class="fa-solid fa-house-user text-xl mb-1"></i>
        <span>Pizarra Casa</span>
      </button>
      <button onclick="cambiarSeccion('sec-notas', this)" class="btn-nav flex flex-col items-center hover:text-indigo-600">
        <i class="fa-solid fa-clipboard-list text-xl mb-1"></i>
        <span>Notas</span>
      </button>
    </nav>
  </div>

  <script>
    // URL de tu Google Apps Script ya integrada
    const API_URL = "https://script.google.com/macros/s/AKfycbzCm6A5bq0rjwtsfr5kbR1NtwjEVql0HDTTyrnalkPkDnS0oLUjsoZL2UmI0NMSuQFnBQ/exec";

    const integrantesDefault = [
      { id: 1, nombre: "Verónica", rol: "Adulto", avatar: "👩‍👧", puntos: 0 },
      { id: 2, nombre: "Alejandra", rol: "Adulto", avatar: "👩", puntos: 0 },
      { id: 3, nombre: "Alberto", rol: "Adulto", avatar: "👨", puntos: 0 },
      { id: 4, nombre: "Julián", rol: "Adulto", avatar: "🧑‍💻", puntos: 0 },
      { id: 5, nombre: "Liam", rol: "Niño", avatar: "👦", puntos: 0 },
      { id: 6, nombre: "Manuel", rol: "Niño", avatar: "🧒", puntos: 0 }
    ];

    let usuarioActual = null;
    let datosServidor = { tareas: [], notas: [], integrantes: [] };

    function inicializar() {
      renderUsuarios();
      cargarDatosServidor();
    }

    function renderUsuarios() {
      const contenedor = document.getElementById("contenedor-usuarios");
      contenedor.innerHTML = "";
      integrantesDefault.forEach(user => {
        contenedor.innerHTML += `
          <button onclick="seleccionarUsuario('${user.nombre}')" class="flex flex-col items-center p-3 bg-slate-50 hover:bg-indigo-50 border border-slate-200 rounded-2xl transition shadow-sm">
            <span class="text-4xl mb-1">${user.avatar}</span>
            <span class="font-bold text-slate-700 text-sm">${user.nombre}</span>
            <span class="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full mt-1">${user.rol}</span>
          </button>
        `;
      });
    }

    function seleccionarUsuario(nombre) {
      usuarioActual = integrantesDefault.find(u => u.nombre === nombre);
      document.getElementById("pantalla-login").classList.add("hidden");
      document.getElementById("pantalla-app").classList.remove("hidden");
      document.getElementById("user-nombre").innerText = usuarioActual.nombre;
      document.getElementById("user-avatar").innerText = usuarioActual.avatar;
      renderPantallas();
    }

    function cerrarSesion() {
      usuarioActual = null;
      document.getElementById("pantalla-app").classList.add("hidden");
      document.getElementById("pantalla-login").classList.remove("hidden");
    }

    function cambiarSeccion(idSec, btn) {
      document.querySelectorAll("main > section").forEach(sec => sec.classList.add("hidden"));
      document.getElementById(idSec).classList.remove("hidden");
      document.querySelectorAll(".btn-nav").forEach(b => b.classList.remove("text-indigo-600"));
      if (btn) btn.classList.add("text-indigo-600");
    }

    async function cargarDatosServidor() {
      try {
        const res = await fetch(`${API_URL}?action=getInicial`);
        if (res.ok) {
          const data = await res.json();
          if (data.tareas) datosServidor.tareas = data.tareas;
          if (data.notas) datosServidor.notas = data.notas;
          if (data.integrantes) datosServidor.integrantes = data.integrantes;
          renderPantallas();
        }
      } catch (err) {
        console.warn("Cargando datos...", err);
      }
    }

    function renderPantallas() {
      if (!usuarioActual) return;
      const intBD = datosServidor.integrantes.find(i => i.Nombre === usuarioActual.nombre);
      const puntosTotal = intBD ? intBD.PuntosAcumulados : usuarioActual.puntos;
      document.getElementById("user-puntos").innerText = `⭐ ${puntosTotal} Puntos`;

      const listaTareas = document.getElementById("lista-mis-tareas");
      const misTareas = datosServidor.tareas.filter(t => t.Asignado_A === usuarioActual.nombre && t.Estado !== "Completada");

      if (misTareas.length === 0) {
        listaTareas.innerHTML = `
          <div class="text-center py-10 bg-white rounded-2xl shadow-sm border border-slate-100">
            <span class="text-4xl">🎉</span>
            <p class="font-bold text-slate-700 mt-2">¡Todo al día!</p>
            <p class="text-xs text-slate-400">No tienes obligaciones pendientes.</p>
          </div>
        `;
      } else {
        listaTareas.innerHTML = misTareas.map(t => `
          <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 ${getPrioridadColor(t.Prioridad)} flex justify-between items-center">
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-slate-800">${t.Nombre_Tarea}</span>
                <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded font-bold text-slate-600">${t.Prioridad}</span>
              </div>
              <p class="text-xs text-slate-500 mt-1">⏰ ${t.Horario} | Recompensa: +${t.Puntos_Otorgados} pts</p>
            </div>
            <button onclick="completarTarea('${t.ID_Tarea}')" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-xl text-xs shadow transition">
              ✓ Listo
            </button>
          </div>
        `).join("");
      }

      const tablon = document.getElementById("tablon-familia");
      tablon.innerHTML = integrantesDefault.map(member => {
        const tareasMiembro = datosServidor.tareas.filter(t => t.Asignado_A === member.nombre && t.Estado !== "Completada");
        const datosMiembroBD = datosServidor.integrantes.find(i => i.Nombre === member.nombre);
        const pts = datosMiembroBD ? datosMiembroBD.PuntosAcumulados : 0;
        return `
          <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
            <div class="flex items-center gap-3">
              <span class="text-2xl">${member.avatar}</span>
              <div>
                <p class="font-bold text-sm text-slate-800">${member.nombre}</p>
                <p class="text-[11px] text-slate-400">${tareasMiembro.length} tareas pendientes</p>
              </div>
            </div>
            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-xl">⭐ ${pts} pts</span>
          </div>
        `;
      }).join("");

      const contenedorNotas = document.getElementById("contenedor-notas");
      if (datosServidor.notas.length === 0) {
        contenedorNotas.innerHTML = `<p class="text-xs text-slate-400 text-center col-span-2 py-6">No hay notas publicadas.</p>`;
      } else {
        contenedorNotas.innerHTML = datosServidor.notas.map(n => `
          <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 shadow-sm relative">
            <h4 class="font-bold text-amber-900 text-sm mb-1">${n.Titulo}</h4>
            <p class="text-xs text-amber-800 leading-relaxed">${n.Contenido}</p>
            <div class="flex justify-between items-center mt-3 pt-2 border-t border-amber-200/50 text-[10px] text-amber-700">
              <span>Por: ${n.Creador}</span>
              <span>${n.Fecha_Creacion}</span>
            </div>
          </div>
        `).join("");
      }
    }

    function getPrioridadColor(prioridad) {
      if (prioridad === "Alta") return "border-red-500";
      if (prioridad === "Media") return "border-amber-500";
      return "border-emerald-500";
    }

    async function completarTarea(idTarea) {
      const estado = (usuarioActual.rol === "Niño") ? "En Revisión" : "Completada";
      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "completarTarea", idTarea: idTarea, nuevoEstado: estado })
        });
        const tarea = datosServidor.tareas.find(t => t.ID_Tarea === idTarea);
        if (tarea) tarea.Estado = estado;
        renderPantallas();
      } catch (e) {
        console.error("Error al completar la tarea", e);
      }
    }

    function abrirModalTarea() {
      alert("Para agregar una tarea regístrala directamente en tu hoja de Google Sheets en la pestaña 'Tareas'.");
    }

    function abrirModalNota() {
      const titulo = prompt("Título de la nota:");
      const contenido = prompt("Contenido de la nota:");
      if (titulo && contenido) {
        fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "agregarNota", creador: usuarioActual.nombre, visibilidad: "Toda la Casa", titulo: titulo, contenido: contenido })
        }).then(() => cargarDatosServidor());
      }
    }

    window.onload = inicializar;
  </script>
</body>
</html>
